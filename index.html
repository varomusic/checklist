<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Checklist diaria</title>
  <style>
    :root { color-scheme: light; }
    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      margin: 0;
      background: #f6f7fb;
      color: #111;
    }
    .wrap {
      max-width: 720px;
      margin: 0 auto;
      padding: 24px 16px 48px;
    }
    header {
      background: #ffffff;
      border-radius: 16px;
      padding: 18px 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,.06);
      margin-bottom: 14px;
    }
    h1 { font-size: 20px; margin: 0 0 4px; }
    p { margin: 0; opacity: .75; font-size: 14px; }

    .card {
      background: #ffffff;
      border-radius: 16px;
      padding: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,.06);
    }

    form {
      display: flex;
      gap: 10px;
      margin-bottom: 14px;
    }
    input[type="text"] {
      flex: 1;
      padding: 12px 12px;
      border-radius: 12px;
      border: 1px solid #e6e8ef;
      outline: none;
      font-size: 15px;
    }
    input[type="text"]:focus {
      border-color: #b8c2ff;
      box-shadow: 0 0 0 4px rgba(120, 134, 255, .12);
    }
    button {
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid #e6e8ef;
      background: #111;
      color: white;
      cursor: pointer;
      font-size: 14px;
      white-space: nowrap;
    }
    button.secondary {
      background: #fff;
      color: #111;
    }
    button:active { transform: translateY(1px); }

    .meta {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: center;
      margin-bottom: 10px;
      flex-wrap: wrap;
      font-size: 13px;
      opacity: .85;
    }
    .meta .actions { display: flex; gap: 8px; }

    ul {
      list-style: none;
      padding: 0;
      margin: 0;
      display: grid;
      gap: 10px;
    }
    .item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 12px;
      border: 1px solid #eef0f6;
      border-radius: 14px;
    }
    .item input[type="checkbox"] {
      width: 18px;
      height: 18px;
    }
    .text {
      flex: 1;
      font-size: 15px;
      line-height: 1.25;
    }
    .done .text {
      text-decoration: line-through;
      opacity: .6;
    }
    .del {
      border: 0;
      background: transparent;
      color: #6b7280;
      cursor: pointer;
      font-size: 14px;
      padding: 6px 8px;
      border-radius: 10px;
    }
    .del:hover { background: #f2f3f7; }
    .hint {
      margin-top: 10px;
      font-size: 12px;
      opacity: .7;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>Checklist Perforación Y Voladura</h1>
      <p>Agrega tus tareas y selecciona lo que completes. Se guarda automáticamente en este dispositivo.</p>
    </header>

    <div class="card">
      <form id="addForm" autocomplete="off">
        <input id="taskInput" type="text" placeholder="Escribe un ítem… (Ej: enviar reporte, asistencia)" />
        <button type="submit">Agregar</button>
      </form>

      <div class="meta">
        <div id="counter">0 pendientes</div>
        <div class="actions">
          <button class="secondary" id="clearDone" type="button">Borrar completados</button>
          <button class="secondary" id="clearAll" type="button">Borrar todo</button>
        </div>
      </div>

      <ul id="list"></ul>
      <div class="hint">Tip: si recargas la página, tu lista seguirá igual (usa almacenamiento local del navegador).</div>
      <div class="signature">
  APP creada por <strong>Alvaro Ariza</strong>
</div>
    </div>
  </div>

  <script>
    const STORAGE_KEY = "checklist_items_v1";

    const addForm = document.getElementById("addForm");
    const taskInput = document.getElementById("taskInput");
    const list = document.getElementById("list");
    const counter = document.getElementById("counter");
    const clearDoneBtn = document.getElementById("clearDone");
    const clearAllBtn = document.getElementById("clearAll");

    /** @type {{id:string, text:string, done:boolean}[]} */
    let items = load();

    function uid() {
      return Math.random().toString(16).slice(2) + Date.now().toString(16);
    }

    function load() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        return raw ? JSON.parse(raw) : [];
      } catch {
        return [];
      }
    }

    function save() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
    }

    function render() {
      list.innerHTML = "";

      items.forEach((it) => {
        const li = document.createElement("li");
        li.className = "item" + (it.done ? " done" : "");
        li.dataset.id = it.id;

        const cb = document.createElement("input");
        cb.type = "checkbox";
        cb.checked = it.done;
        cb.addEventListener("change", () => toggle(it.id));

        const span = document.createElement("div");
        span.className = "text";
        span.textContent = it.text;

        const del = document.createElement("button");
        del.className = "del";
        del.type = "button";
        del.textContent = "Eliminar";
        del.addEventListener("click", () => remove(it.id));

        li.appendChild(cb);
        li.appendChild(span);
        li.appendChild(del);

        list.appendChild(li);
      });

      const pending = items.filter(i => !i.done).length;
      counter.textContent = pending === 1 ? "1 pendiente" : `${pending} pendientes`;
    }

    function add(text) {
      const clean = text.trim();
      if (!clean) return;
      items.unshift({ id: uid(), text: clean, done: false });
      save();
      render();
    }

    function toggle(id) {
      items = items.map(i => i.id === id ? { ...i, done: !i.done } : i);
      save();
      render();
    }

    function remove(id) {
      items = items.filter(i => i.id !== id);
      save();
      render();
    }

    function clearDone() {
      items = items.filter(i => !i.done);
      save();
      render();
    }

    function clearAll() {
      items = [];
      save();
      render();
    }

    addForm.addEventListener("submit", (e) => {
      e.preventDefault();
      add(taskInput.value);
      taskInput.value = "";
      taskInput.focus();
    });

    clearDoneBtn.addEventListener("click", clearDone);
    clearAllBtn.addEventListener("click", clearAll);

    render();
    taskInput.focus();
  </script>
</body>
</html>
